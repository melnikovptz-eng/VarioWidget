name: VarioWidget

options:
  bundleIdPrefix: com.pavel
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  Vario:
    type: application
    platform: iOS

    sources:
      - path: AppSources

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pavel.vario
      INFOPLIST_FILE: VarioWidget/Info.plist
      CODE_SIGN_ENTITLEMENTS: AppSources/Vario.entitlements

    dependencies:
      - target: VarioWidgetExtension

  VarioWidgetExtension:
    type: app-extension
    platform: iOS

    sources:
      - path: WidgetSources

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pavel.vario.widget
      INFOPLIST_FILE: VarioWidget/WidgetInfo.plist
      CODE_SIGN_ENTITLEMENTS: WidgetSources/Vario.entitlements

    dependencies: []

  VarioUITests:
    type: bundle.ui-testing
    platform: iOS

    sources:
      - path: UITests

    dependencies:
      - target: Vario

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pavel.vario.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Vario

schemes:
  Vario:
    build:
      targets:
        Vario: all
        VarioWidgetExtension: all
    test:
      config: Debug
      targets:
        - VarioUITests
